<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- rounded orange tile -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#brand)"/>

  <!-- ascending signal bars -->
  <g fill="#ffffff">
    <rect x="6.5"  y="17" width="4" height="9"  rx="2" fill-opacity="0.78"/>
    <rect x="12"   y="12" width="4" height="14" rx="2" fill-opacity="0.92"/>
    <rect x="17.5" y="7"  width="4" height="19" rx="2"/>
  </g>

  <!-- orbiting pulse -->
  <circle cx="24.6" cy="9" r="2.6" fill="#ffffff"/>
  <circle cx="24.6" cy="9" r="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
</svg>
