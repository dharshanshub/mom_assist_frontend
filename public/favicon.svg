<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#brand)" filter="url(#glow)">
    <!-- outer hexagon -->
    <path d="M16 3L27 9.5V22.5L16 29L5 22.5V9.5L16 3Z" stroke-width="1.9" stroke-linejoin="round" stroke-opacity="0.9"/>
    <!-- spokes -->
    <g stroke-width="1.4" stroke-opacity="0.8">
      <line x1="16" y1="16" x2="16" y2="4.6"/>
      <line x1="16" y1="16" x2="25.6" y2="10.3"/>
      <line x1="16" y1="16" x2="25.6" y2="21.7"/>
      <line x1="16" y1="16" x2="16" y2="27.4"/>
      <line x1="16" y1="16" x2="6.4" y2="21.7"/>
      <line x1="16" y1="16" x2="6.4" y2="10.3"/>
    </g>
  </g>

  <g fill="url(#brand)" filter="url(#glow)">
    <!-- center node -->
    <circle cx="16" cy="16" r="3.4"/>
    <!-- outer nodes -->
    <circle cx="16" cy="4.6" r="2"/>
    <circle cx="25.6" cy="10.3" r="2"/>
    <circle cx="25.6" cy="21.7" r="2"/>
    <circle cx="16" cy="27.4" r="2"/>
    <circle cx="6.4" cy="21.7" r="2"/>
    <circle cx="6.4" cy="10.3" r="2"/>
  </g>
</svg>
